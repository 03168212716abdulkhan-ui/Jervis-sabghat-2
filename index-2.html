<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS - Sabghat AI Assistant</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(135deg,#06101f,#003b68)}
.card{width:100%;max-width:520px;text-align:center;padding:35px 22px;border:1px solid #159ee8;border-radius:28px;background:#071526;box-shadow:0 0 35px #0008}
h1{font-size:52px;margin:0 0 8px;color:#42bfff;letter-spacing:4px}p{color:#b9d4e8;font-size:17px}
button{width:85%;max-width:330px;padding:18px;margin:10px;border:0;border-radius:35px;background:#1498d7;color:white;font-size:18px;font-weight:bold}
#status{margin:20px 0;padding:18px;border:1px solid #12618a;border-radius:18px;min-height:55px}
.small{font-size:14px;color:#8fb0c7}
</style>
</head>
<body>
<div class="card">
<h1>JARVIS</h1><p>Sabghat's personal web assistant</p>
<button onclick="talk()">🎙️ Talk to JARVIS</button>
<button onclick="testVoice()">🔊 Test Voice</button>
<div id="status">Ready. Press Talk and say “hello”.</div>
<div class="small">Try: “open YouTube”, “open Google”, “search eFootball”, or “what time is it?”</div>
</div>
<script>
const s=document.getElementById("status");
function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";speechSynthesis.speak(u)}}
function testVoice(){s.textContent="JARVIS: Voice test working.";speak("Hello Sabghat. JARVIS is ready.")}
function talk(){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){s.textContent="Voice recognition is not supported. Use Chrome.";return}
let r=new SR();r.lang="en-US";r.interimResults=false;r.maxAlternatives=1;s.textContent="🎙️ Listening...";r.start();
r.onresult=e=>{
let t=e.results[0][0].transcript.toLowerCase();s.textContent="You said: "+t;
if(t.includes("open youtube")){speak("Opening YouTube.");location.href="https://www.youtube.com/"}
else if(t.includes("open google")){speak("Opening Google.");location.href="https://www.google.com/"}
else if(t.includes("search")){let q=t.replace("search","").trim()||"eFootball";speak("Searching Google.");location.href="https://www.google.com/search?q="+encodeURIComponent(q)}
else if(t.includes("time")){let x=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});s.textContent="Current time: "+x;speak("The time is "+x)}
else if(t.includes("hello")||t.includes("hi"))speak("Hello Sabghat. How can I help you?");
else speak("I heard you say "+t)
};
r.onerror=e=>s.textContent="Microphone error: "+e.error;
}
</script>
</body>
</html>
